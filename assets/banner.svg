<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#34d399;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#c084fc;#818cf8;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .mono-text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 1.1s infinite;
      }

      @keyframes floatPill1 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatPill2 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatPill3 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }
      .pill-1 { animation: floatPill1 6s ease-in-out infinite; }
      .pill-2 { animation: floatPill2 7s ease-in-out infinite; }
      .pill-3 { animation: floatPill3 5.5s ease-in-out infinite; }

      @keyframes pulseGrid {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.22; }
      }
      .grid-layer { animation: pulseGrid 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="1196" height="376" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Light Circles (Background Depth) -->
  <circle cx="200" cy="80" r="130" fill="#38bdf8" opacity="0.07" filter="url(#neonGlow)">
    <animate attributeName="cy" values="80;110;80" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="280" r="150" fill="#818cf8" opacity="0.08" filter="url(#neonGlow)">
    <animate attributeName="cy" values="280;250;280" dur="11s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="340" r="120" fill="#34d399" opacity="0.06" filter="url(#neonGlow)">
    <animate attributeName="r" values="120;140;120" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Geometric Grid Pattern (Atmospheric) -->
  <g class="grid-layer" stroke="#64748b" stroke-width="0.75" stroke-dasharray="3,6">
    <line x1="80" y1="0" x2="80" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="320" y1="0" x2="320" y2="380" />
    <line x1="440" y1="0" x2="440" y2="380" />
    <line x1="560" y1="0" x2="560" y2="380" />
    <line x1="680" y1="0" x2="680" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
    <line x1="920" y1="0" x2="920" y2="380" />
    <line x1="1040" y1="0" x2="1040" y2="380" />
    <line x1="1120" y1="0" x2="1120" y2="380" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Ambient Dynamic Floating Badges (Kept in Background, Low Opacity) -->
  <g opacity="0.45">
    <!-- Starship Pill -->
    <g class="pill-1" transform="translate(60, 48)">
      <rect width="116" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="58" y="20" class="mono-text" font-size="12" fill="#38bdf8" font-weight="600" text-anchor="middle">🚀 Starship</text>
    </g>

    <!-- Zsh Pill -->
    <g class="pill-2" transform="translate(1010, 48)">
      <rect width="124" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
      <text x="62" y="20" class="mono-text" font-size="12" fill="#c084fc" font-weight="600" text-anchor="middle">⚡ Oh My Zsh</text>
    </g>

    <!-- Speed Pill -->
    <g class="pill-3" transform="translate(50, 310)">
      <rect width="138" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
      <text x="69" y="20" class="mono-text" font-size="12" fill="#34d399" font-weight="600" text-anchor="middle">⚡ sub-10ms render</text>
    </g>

    <!-- Cross Shell Pill -->
    <g class="pill-1" transform="translate(980, 310)">
      <rect width="160" height="30" rx="15" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" />
      <text x="80" y="20" class="mono-text" font-size="12" fill="#f472b6" font-weight="600" text-anchor="middle">🌐 Cross-Shell Ready</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, Terminal Mockup (100% Legibility & Visual Hierarchy) -->
  <g id="foreground-content">
    <!-- Top Terminal Dots -->
    <g transform="translate(48, 38)">
      <circle cx="0" cy="0" r="6" fill="#ef4444" />
      <circle cx="20" cy="0" r="6" fill="#f59e0b" />
      <circle cx="40" cy="0" r="6" fill="#10b981" />
      <text x="65" y="4" class="mono-text" font-size="12" fill="#64748b" letter-spacing="1">terminal: ~/awesome-shell-prompts</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(600, 72)">
      <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="4" class="mono-text" font-size="11" fill="#7dd3fc" font-weight="600" letter-spacing="1.5" text-anchor="middle">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" class="sans-text" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" text-anchor="middle" filter="url(#subtleGlow)">
      AWESOME SHELL PROMPTS
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" class="sans-text" font-size="17" font-weight="400" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.2">
      Curated List of SaaS Platforms &amp; Open-Source Projects for Instant-Rendering, Beautiful Terminal Prompts
    </text>

    <!-- Interactive Terminal Command Bar / Prompt Mockup -->
    <g transform="translate(600, 240)">
      <!-- Terminal Bar Container -->
      <rect x="-380" y="0" width="760" height="64" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.6" filter="url(#subtleGlow)" />
      
      <!-- Powerline Segments -->
      <!-- Segment 1: Shell Icon & Directory -->
      <path d="M -366 12 L -180 12 L -165 32 L -180 52 L -366 52 Z" fill="#0284c7" />
      <text x="-275" y="37" class="mono-text" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">📁 ~/awesome-prompts</text>

      <!-- Segment 2: Git Branch & Status -->
      <path d="M -165 12 L 20 12 L 35 32 L 20 52 L -165 52 L -150 32 Z" fill="#7c3aed" />
      <text x="-65" y="37" class="mono-text" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle"> main [✓ 2026]</text>

      <!-- Segment 3: Execution Time / Benchmark -->
      <path d="M 35 12 L 180 12 L 195 32 L 180 52 L 35 52 L 50 32 Z" fill="#059669" />
      <text x="115" y="37" class="mono-text" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ 8.2ms instant</text>

      <!-- Prompt Symbol & Cursor -->
      <text x="215" y="37" class="mono-text" font-size="15" font-weight="800" fill="#38bdf8">❯</text>
      <text x="235" y="37" class="mono-text" font-size="13" fill="#94a3b8">starship init zsh</text>
      <!-- Blinking Cursor -->
      <rect x="360" y="21" width="8" height="18" fill="#38bdf8" class="cursor" />
    </g>

    <!-- Bottom Feature Pills -->
    <g transform="translate(600, 342)">
      <text x="0" y="0" class="mono-text" font-size="12" fill="#64748b" text-anchor="middle">
        <tspan fill="#38bdf8">★</tspan> Cross-Shell Compatibility  •  
        <tspan fill="#34d399">⚡</tspan> Sub-Millisecond Rendering  •  
        <tspan fill="#c084fc">🎨</tspan> Nerd Font &amp; Powerline Support  •  
        <tspan fill="#f59e0b">🛡️</tspan> Zero Latency Overhead
      </text>
    </g>
  </g>
</svg>
